name: PR Checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group:
    pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.mod

      - name: Install dependencies
        run: npm ci

      - name: Verify repository
        run: npm run check

  # The Dockerized peer suite is the only check that runs the client and server
  # images against each other over a real network, with a real DoH resolver and
  # TLS terminator, so it gates every pull request rather than the tag alone.
  # It is a separate job because it builds both images: off the critical path,
  # the format, lint, and unit feedback stays fast, and a failure here is
  # attributable without reading the log.
  e2e:
    runs-on: ubuntu-latest
    # The suite waits on containers and on a TTY prompt, so a hang would
    # otherwise hold a runner for the six-hour default.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Node is the task runner only. The suite builds and runs everything it
      # needs inside containers, so it depends on no installed package and
      # needs no `npm ci`.
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'

      # Pairing is confirmed at a controlling TTY, which the suite drives with
      # expect. The runner image does not carry it.
      - name: Install expect
        run: sudo apt-get update && sudo apt-get install --yes expect

      - name: End-to-end v2 integration
        run: npm run test:e2e:v2
