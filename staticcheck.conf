# One configuration for every module in this repository. staticcheck walks up
# from the directory it runs in, so the tools module and the protocol vector
# generator resolve this file too.
#
# "all" turns on the ST* style checks that staticcheck leaves off by default.
#
# ST1005 is the exception. It reads a leading capital as a sentence opening,
# because a caller that wraps an error quotes the string mid-sentence. Every
# error string it reports here opens with "Git", the name of the program whose
# behavior the message describes. Lowercasing a proper noun to satisfy the
# check would make the message wrong, so the check is off and the messages
# stay as they are.
checks = ["all", "-ST1005"]
